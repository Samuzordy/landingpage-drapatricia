<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <!-- TEMPLATE placeholder for the About portrait (4:5). Neutral abstract bust in the default
       palette — replace with the professional's photo (see README). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe3da"/>
      <stop offset="0.55" stop-color="#e3c9bb"/>
      <stop offset="1" stop-color="#cfa392"/>
    </linearGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e7df"/>
      <stop offset="1" stop-color="#e2c6b8"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.022" numOctaves="3" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.66  0 0 0 0 0.39  0 0 0 0 0.31  0 0 0 0.14 0"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <g filter="url(#soft)" opacity="0.55">
    <ellipse cx="200" cy="230" rx="240" ry="200" fill="#f7f1ec"/>
    <ellipse cx="640" cy="820" rx="230" ry="200" fill="#a8634f" opacity="0.35"/>
  </g>
  <!-- window light -->
  <g fill="#f7f1ec" opacity="0.35">
    <rect x="70" y="90" width="150" height="330" rx="75"/>
    <rect x="240" y="90" width="150" height="330" rx="75" opacity="0.7"/>
  </g>
  <!-- abstract bust, slightly off-center -->
  <g fill="url(#figure)" opacity="0.85">
    <ellipse cx="450" cy="390" rx="104" ry="126"/>
    <path d="M450 540c-140 0-246 70-274 202-10 46-14 168-14 258h576c0-90-4-212-14-258-28-132-134-202-274-202z"/>
  </g>
  <rect width="800" height="1000" filter="url(#grain)"/>
</svg>
