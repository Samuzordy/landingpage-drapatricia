<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <!-- ILLUSTRATIVE (generated) "microscopic" layer for DermatoscopeLens. Not a clinical image.
       TODO(cliente): replace with public/images/textura-pele-detalhe.jpg (min. 2000px). -->
  <defs>
    <filter id="micro" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="4" seed="3" result="n"/>
      <feColorMatrix in="n" values="0 0 0 0 0.79  0 0 0 0 0.56  0 0 0 0 0.49  0 0 0 1.1 -0.25"/>
    </filter>
    <filter id="ridges" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.006 0.022" numOctaves="2" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.66  0 0 0 0 0.39  0 0 0 0 0.31  0 0 0 -2.2 1.05"/>
    </filter>
    <pattern id="cells" width="46" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <path d="M0 20 Q11 4 23 20 T46 20" fill="none" stroke="#a8634f" stroke-width="0.9" opacity="0.35"/>
      <circle cx="23" cy="30" r="2.2" fill="#8f4e3c" opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="#ecd4c8"/>
  <rect width="800" height="1000" filter="url(#micro)"/>
  <rect width="800" height="1000" fill="url(#cells)"/>
  <rect width="800" height="1000" filter="url(#ridges)" opacity="0.5"/>
  <!-- fine annotations, spread so the lens always finds some -->
  <g fill="none" stroke="#3b2a25" stroke-width="1" opacity="0.55" font-family="Manrope, ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(470 420)"><circle r="16"/><path d="M16 0h64"/><text x="86" y="5" font-size="14" fill="#3b2a25" stroke="none">detalhe ilustrativo</text></g>
    <g transform="translate(250 260)"><path d="M-10 0h20M0 -10v20"/><path d="M14 -14l40 -40"/><text x="58" y="-58" font-size="14" fill="#3b2a25" stroke="none">10x</text></g>
    <g transform="translate(560 690)"><circle r="10"/><path d="M-10 0h-60"/><text x="-160" y="5" font-size="14" fill="#3b2a25" stroke="none">textura</text></g>
    <g transform="translate(180 560)"><path d="M0 0h80M0 -5v10M80 -5v10"/><text x="0" y="-12" font-size="13" fill="#3b2a25" stroke="none">escala ilustrativa</text></g>
    <g transform="translate(600 200)"><path d="M-10 0h20M0 -10v20"/></g>
    <g transform="translate(360 820)"><circle r="12"/><path d="M12 0h50"/><text x="68" y="5" font-size="14" fill="#3b2a25" stroke="none">ilustração</text></g>
  </g>
</svg>
