<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <!-- PROVISIONAL placeholder for the hero portrait. TODO(cliente): replace with public/images/retrato-hero.png -->
  <defs>
    <radialGradient id="warm" cx="58%" cy="34%" r="80%">
      <stop offset="0" stop-color="#f7f1ec"/>
      <stop offset="0.45" stop-color="#ecdcd0"/>
      <stop offset="1" stop-color="#d9b6a6"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="3" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.66  0 0 0 0 0.39  0 0 0 0 0.31  0 0 0 0.16 0"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="800" height="1000" fill="url(#warm)"/>
  <rect width="800" height="1000" filter="url(#grain)"/>
  <!-- organic "cells" -->
  <g filter="url(#soft)" opacity="0.55">
    <ellipse cx="560" cy="300" rx="230" ry="210" fill="#e9dcd1"/>
    <ellipse cx="250" cy="720" rx="260" ry="200" fill="#c98f7e" opacity="0.45"/>
  </g>
  <g fill="none" stroke="#c98f7e" stroke-width="1.2" opacity="0.7">
    <circle cx="470" cy="420" r="90"/>
    <circle cx="470" cy="420" r="140"/>
    <circle cx="470" cy="420" r="190" opacity="0.6"/>
    <circle cx="470" cy="420" r="240" opacity="0.35"/>
  </g>
  <g font-family="Manrope, ui-sans-serif, system-ui, sans-serif" fill="#3b2a25" text-anchor="middle">
    <text x="400" y="880" font-size="22" letter-spacing="4" opacity="0.75">RETRATO PROVISÓRIO</text>
    <text x="400" y="916" font-size="20" opacity="0.6">aguardando a fotografia da Dra. Valéria</text>
  </g>
</svg>
